<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="hermes-topology-title hermes-topology-desc">
  <title id="hermes-topology-title">Hermes 本地部署拓扑</title>
  <desc id="hermes-topology-desc">消息经 Ubuntu 唯一主 Gateway 处理，模型请求通过 Mac 代理；阿里云 ECS 只负责远程运维中转与异机备份。</desc>
  <defs><marker id="hermes-topology-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4f5d75"/></marker></defs>
  <style>.eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:.12em;fill:#7a8399}.heading{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4f5d75}.zone{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:.1em;fill:#7a8399}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#hermes-topology-arrow)}.dash{fill:none;stroke:#7a8399;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#hermes-topology-arrow)}</style>
  <rect width="1280" height="680" rx="24" fill="#f5f5f5"/><text class="eyebrow" x="48" y="52">SYSTEM TOPOLOGY</text><text class="heading" x="48" y="92">唯一主节点处理消息，代理与运维路径彼此解耦</text>
  <g transform="translate(48 130)"><rect width="176" height="410" rx="16" fill="#ececec" stroke="#bfc0c0"/><text class="zone" x="20" y="30">ACCESS</text><rect x="20" y="58" width="136" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="88" y="85" text-anchor="middle">微信 / 飞书</text><text class="body" x="88" y="106" text-anchor="middle">消息入口</text><rect x="20" y="282" width="136" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="88" y="309" text-anchor="middle">远程管理员</text><text class="body" x="88" y="330" text-anchor="middle">Workbench</text>
    <rect x="236" width="330" height="410" rx="16" fill="#ececec" stroke="#bfc0c0"/><text class="zone" x="256" y="30">OLD INTEL MAC · 7×24 HOST</text><rect x="260" y="58" width="282" height="154" rx="14" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="284" y="88">VirtualBox · Ubuntu 24.04</text><rect x="284" y="110" width="234" height="74" rx="12" fill="#f8ece7" stroke="#eb6c36" stroke-width="2"/><text class="label" x="401" y="140" text-anchor="middle">Hermes Gateway</text><text class="body" x="401" y="163" text-anchor="middle">唯一主运行节点</text><rect x="260" y="246" width="132" height="72" rx="12" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="326" y="275" text-anchor="middle">Shadowrocket</text><text class="body" x="326" y="298" text-anchor="middle">生产代理出口</text><rect x="410" y="246" width="132" height="72" rx="12" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="476" y="275" text-anchor="middle">反向 SSH</text><text class="body" x="476" y="298" text-anchor="middle">受管隧道</text>
    <rect x="626" width="258" height="410" rx="16" fill="#ececec" stroke="#bfc0c0"/><text class="zone" x="646" y="30">MODEL ACCESS</text><rect x="650" y="58" width="210" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="755" y="85" text-anchor="middle">Ubuntu 本地代理组</text><text class="body" x="755" y="106" text-anchor="middle">受控路由 / 故障策略</text><rect x="650" y="152" width="210" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="755" y="179" text-anchor="middle">ChatGPT Codex</text><text class="body" x="755" y="200" text-anchor="middle">主模型</text><rect x="650" y="246" width="210" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="755" y="273" text-anchor="middle">DeepSeek</text><text class="body" x="755" y="294" text-anchor="middle">跨提供商备用</text>
    <rect x="944" width="240" height="410" rx="16" fill="#ececec" stroke="#bfc0c0"/><text class="zone" x="964" y="30">ALIBABA ECS</text><rect x="968" y="58" width="192" height="64" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="1064" y="85" text-anchor="middle">运维中转</text><text class="body" x="1064" y="106" text-anchor="middle">仅回环端口转发</text><rect x="968" y="246" width="192" height="72" rx="10" fill="#f5f5f5" stroke="#bfc0c0"/><text class="label" x="1064" y="275" text-anchor="middle">异机备份</text><text class="body" x="1064" y="298" text-anchor="middle">受限账号 · 每周轮换</text>
    <path class="line" d="M156 90H244V147H284"/><path class="line" d="M518 147H618V90H650"/><path class="line" d="M650 128H590V282H392"/><path class="line" d="M755 122v30"/><path class="line" d="M755 216v30"/>
    <path class="dash" d="M156 314H226V366H1064V122"/><path class="dash" d="M968 282H566"/><path class="dash" d="M476 246V218H968V90"/>
    <text class="body" x="574" y="348">远程运维：ECS → Mac → VM</text>
  </g>
  <g transform="translate(48 590)"><line x2="1184" stroke="#bfc0c0"/><line x1="0" y1="34" x2="54" y2="34" stroke="#4f5d75" stroke-width="2"/><text class="body" x="66" y="39">运行 / 消息路径</text><line x1="230" y1="34" x2="284" y2="34" stroke="#7a8399" stroke-width="2" stroke-dasharray="8 6"/><text class="body" x="296" y="39">远程运维 / 备份路径</text><rect x="524" y="21" width="14" height="14" rx="3" fill="#f8ece7" stroke="#eb6c36"/><text class="body" x="550" y="34">唯一主 Hermes Gateway</text><text class="body" x="1184" y="39" text-anchor="end">云端 Gateway：保持关闭</text></g>
</svg>
