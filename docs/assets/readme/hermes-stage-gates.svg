<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="hermes-gates-title hermes-gates-desc">
  <title id="hermes-gates-title">Hermes 部署阶段门</title>
  <desc id="hermes-gates-desc">从宿主机、虚拟机、Gateway、模型网络、单主切换到备份验收，上一阶段通过后才进入下一阶段。</desc>
  <defs><marker id="hermes-gates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4f5d75"/></marker></defs>
  <style>.eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:.12em;fill:#7a8399}.heading{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.num{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4f5d75}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#hermes-gates-arrow)}</style>
  <rect width="1280" height="420" rx="24" fill="#f5f5f5"/><text class="eyebrow" x="48" y="52">STAGE GATES</text><text class="heading" x="48" y="90">逐层建立、逐层验收，避免把多个故障叠在一起</text>
  <g transform="translate(48 148)">
    <g><rect width="164" height="132" rx="14" fill="#ececec" stroke="#bfc0c0"/><circle cx="28" cy="28" r="16" fill="#2d3142"/><text class="num" x="28" y="33" text-anchor="middle">1</text><text class="label" x="20" y="70">宿主机与隧道</text><text class="body" x="20" y="96">电源 · SSH · 代理</text></g><path class="line" d="M164 66h32"/>
    <g transform="translate(204)"><rect width="164" height="132" rx="14" fill="#ececec" stroke="#bfc0c0"/><circle cx="28" cy="28" r="16" fill="#2d3142"/><text class="num" x="28" y="33" text-anchor="middle">2</text><text class="label" x="20" y="70">Ubuntu VM</text><text class="body" x="20" y="96">资源 · 网络 · 自启</text></g><path class="line" d="M368 66h32"/>
    <g transform="translate(408)"><rect width="164" height="132" rx="14" fill="#f8ece7" stroke="#eb6c36" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#eb6c36"/><text class="num" x="28" y="33" text-anchor="middle">3</text><text class="label" x="20" y="70">Hermes / Gateway</text><text class="body" x="20" y="96">服务 · 消息 · 数据</text></g><path class="line" d="M572 66h32"/>
    <g transform="translate(612)"><rect width="164" height="132" rx="14" fill="#ececec" stroke="#bfc0c0"/><circle cx="28" cy="28" r="16" fill="#2d3142"/><text class="num" x="28" y="33" text-anchor="middle">4</text><text class="label" x="20" y="70">模型与代理</text><text class="body" x="20" y="96">真实调用 · 备用</text></g><path class="line" d="M776 66h32"/>
    <g transform="translate(816)"><rect width="164" height="132" rx="14" fill="#ececec" stroke="#bfc0c0"/><circle cx="28" cy="28" r="16" fill="#2d3142"/><text class="num" x="28" y="33" text-anchor="middle">5</text><text class="label" x="20" y="70">切换唯一主节点</text><text class="body" x="20" y="96">关闭云 Gateway</text></g><path class="line" d="M980 66h32"/>
    <g transform="translate(1020)"><rect width="164" height="132" rx="14" fill="#ececec" stroke="#bfc0c0"/><circle cx="28" cy="28" r="16" fill="#2d3142"/><text class="num" x="28" y="33" text-anchor="middle">6</text><text class="label" x="20" y="70">备份与验收</text><text class="body" x="20" y="96">恢复 · 轮换 · 安全</text></g>
  </g>
  <g transform="translate(48 326)"><rect width="1184" height="46" rx="10" fill="#ececec"/><circle cx="24" cy="23" r="8" fill="#eb6c36"/><text class="body" x="46" y="28">门槛原则：本阶段的服务、真实调用与恢复证据未通过，就不叠加下一层功能。</text><text class="body" x="1158" y="28" text-anchor="end">失败时回到最近一个已验证状态</text></g>
</svg>
